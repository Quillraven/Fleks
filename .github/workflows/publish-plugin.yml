name: Publish Compiler Plugin
on:
  workflow_call:

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  publish-plugin:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest # the plugin is JVM only

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # A version is released once. Snapshots are skipped and so are versions that already exist.
      # That way, changes that do not bump the version (e.g. Kotlin updates) do not fail the build.
      - name: Check which targets need a release
        id: check
        run: |
          version=$(grep '^fleks.plugin.version=' fleks-compiler-plugin/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::notice::Plugin version $version is a snapshot. Nothing to publish."
            echo "central=false" >> "$GITHUB_OUTPUT"
            echo "portal=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exists() { [[ "$(curl -s -o /dev/null -w '%{http_code}' "$1")" == "200" ]]; }

          id="io.github.quillraven.fleks.compiler-plugin"
          central_url="https://repo1.maven.org/maven2/io/github/quillraven/fleks/fleks-compiler-plugin/$version/fleks-compiler-plugin-$version.pom"
          portal_url="https://plugins.gradle.org/m2/io/github/quillraven/fleks/compiler-plugin/$id.gradle.plugin/$version/$id.gradle.plugin-$version.pom"

          if exists "$central_url"; then central=false; else central=true; fi
          if exists "$portal_url"; then portal=false; else portal=true; fi
          echo "central=$central" >> "$GITHUB_OUTPUT"
          echo "portal=$portal" >> "$GITHUB_OUTPUT"

          if [[ "$central" == "false" && "$portal" == "false" ]]; then
            echo "::notice::Plugin version $version is already released. Bump fleks.plugin.version to publish."
          fi

      - name: Setup JDK 17
        if: steps.check.outputs.central == 'true' || steps.check.outputs.portal == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate Gradle wrapper
        if: steps.check.outputs.central == 'true' || steps.check.outputs.portal == 'true'
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        if: steps.check.outputs.central == 'true' || steps.check.outputs.portal == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      # Maven Central first: the Kotlin Gradle plugin resolves the compiler plugin jar from the user's repositories
      # (usually Maven Central), so it must be available before the Gradle plugin is announced on the plugin portal.
      - name: Publish plugin
        if: steps.check.outputs.central == 'true' || steps.check.outputs.portal == 'true'
        run: |
          tasks=""
          if [[ "${{ steps.check.outputs.central }}" == "true" ]]; then
            tasks="$tasks :fleks-compiler-plugin:publishToMavenCentral"
          fi
          if [[ "${{ steps.check.outputs.portal }}" == "true" ]]; then
            tasks="$tasks :fleks-compiler-plugin:publishPlugins"
          fi
          ./gradlew $tasks --no-configuration-cache --no-parallel
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
